name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        run: pytest -q

      # The unit tests cover the two riskiest stages in isolation. This proves the
      # whole pipeline still runs end to end and produces a usable file.
      - name: Run the pipeline end to end
        run: |
          python generate_messy_data.py
          python clean_data.py --report-json data/clean/quality_report.json

      - name: Assert output invariants
        run: |
          python - <<'PY'
          import pandas as pd

          df = pd.read_csv("data/clean/patients_clean.csv")

          assert len(df) > 0, "clean output is empty"
          assert df["patient_id"].notna().all(), "clean output has a null business key"
          assert df["patient_id"].duplicated().sum() == 0, "duplicate patient_ids survived"

          dob = df["date_of_birth"].dropna()
          assert dob.str.match(r"^\d{4}-\d{2}-\d{2}$").all(), "non-ISO date in output"

          los = df["length_of_stay_days"].dropna()
          assert (los >= 0).all(), "negative length of stay in output"

          print(f"OK: {len(df)} rows, unique keys, ISO dates, non-negative stays")
          PY
